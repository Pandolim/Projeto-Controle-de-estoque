<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Gestão</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos específicos para centralizar a caixinha de login na tela */
        body.login-page {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ecf0f1;
            margin: 0;
        }
        .login-card {
            background: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h2 {
            margin-bottom: 25px;
            color: #2c3e50;
        }
    </style>
</head>
<body class="login-page">

    <div class="login-card">
        <h2>Acesso ao Sistema</h2>
        
        <!-- O Formulário que o JavaScript vai escutar -->
        <form id="formLogin">
            <div class="input-group">
                <label for="usuario" style="text-align: left; display: block; font-weight: bold; margin-bottom: 5px;">Usuário</label>
                <input type="text" id="usuario" required placeholder="Digite seu usuário..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 15px;">
            </div>
            
            <div class="input-group">
                <label for="senha" style="text-align: left; display: block; font-weight: bold; margin-bottom: 5px;">Senha</label>
                <input type="password" id="senha" required placeholder="Sua senha..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 20px;">
            </div>
            
            <button type="submit" class="btn-primary" style="width: 100%; font-size: 16px; padding: 12px;">Entrar</button>
        </form>
    </div>

    <!-- O seu JavaScript embalado na tag correta -->
    <script>
        // ==========================================
        // LÓGICA DE LOGIN COM BACKEND SEGURO (HASH)
        // ==========================================
        const formLogin = document.getElementById('formLogin');

        if (formLogin) {
            formLogin.addEventListener('submit', async function(event) {
                event.preventDefault();
                
                const usuario = document.getElementById('usuario').value.trim().toLowerCase();
                const senha = document.getElementById('senha').value;
                const btnSubmit = event.target.querySelector('button[type="submit"]');

                // Trava o botão para evitar cliques duplos e dá feedback visual
                btnSubmit.disabled = true;
                btnSubmit.textContent = "Autenticando...";

                try {
                    // Manda a tentativa de login para o servidor Python
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ usuario: usuario, senha: senha })
                    });
                    
                    const data = await response.json();

                    if (response.ok && data.status === 'sucesso') {
                        // 1. O servidor autorizou! Salvamos os crachás na memória.
                        localStorage.setItem('usuario_logado', data.username);
                        localStorage.setItem('role_logado', data.role);
                        
                        // Se for uma linha de produção, salva o nome da linha
                        if (data.linha) {
                            localStorage.setItem('linha_logada', data.linha);
                        } else {
                            localStorage.removeItem('linha_logada'); // Limpa resquícios de acessos antigos
                        }

                        // 2. O servidor decide para onde o usuário vai com base no 'role'
                        if (data.role === 'admin') {
                            window.location.href = 'admin.html';
                        } else if (data.role === 'pcp') {
                            window.location.href = 'pcp.html';
                        } else if (data.role === 'serra') {
                            window.location.href = 'serra.html';
                        } else if (data.role === 'almoxarifado') {
                            window.location.href = 'almoxarifado.html';
                        } else if (data.role === 'producao') {
                            window.location.href = 'producao.html';
                        } else if (data.role === 'estoque') {
                            window.location.href = 'estoque.html';
                        } else {
                            alert("Cargo desconhecido no sistema. Contate o administrador.");
                            btnSubmit.disabled = false;
                            btnSubmit.textContent = "Entrar";
                        }
                    } else {
                        // O Hash não bateu com a senha, ou o usuário não existe
                        alert('❌ ' + (data.mensagem || 'Usuário ou senha incorretos!'));
                        btnSubmit.disabled = false;
                        btnSubmit.textContent = "Entrar";
                    }
                } catch (error) {
                    console.error("Erro na requisição de login:", error);
                    alert("Erro ao conectar com o servidor. Verifique sua internet.");
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = "Entrar";
                }
            });
        }
    </script>
</body>
</html>
