<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Gestão</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos específicos para centralizar a caixinha de login na tela */
        body.login-page {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ecf0f1;
            margin: 0;
        }
        .login-card {
            background: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h2 {
            margin-bottom: 25px;
            color: #2c3e50;
        }
    </style>
</head>
<body class="login-page">

    <div class="login-card">
        <h2>Acesso ao Sistema</h2>
        
        <!-- O Formulário que o JavaScript vai escutar -->
        <form id="formLogin">
            <div class="input-group">
                <label for="usuario" style="text-align: left; display: block; font-weight: bold; margin-bottom: 5px;">Usuário</label>
                <input type="text" id="usuario" required placeholder="Digite seu usuário..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 15px;">
            </div>
            
            <div class="input-group">
                <label for="senha" style="text-align: left; display: block; font-weight: bold; margin-bottom: 5px;">Senha</label>
                <input type="password" id="senha" required placeholder="Sua senha..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 20px;">
            </div>
            
            <button type="submit" class="btn-primary" style="width: 100%; font-size: 16px; padding: 12px;">Entrar</button>
        </form>
    </div>

    <!-- O seu JavaScript embalado na tag correta -->
    <script>
        // ==========================================
        // LÓGICA DE LOGIN
        // ==========================================
        const formLogin = document.getElementById('formLogin');

        if (formLogin) {
            formLogin.addEventListener('submit', function(event) {
                event.preventDefault();
                const usuario = document.getElementById('usuario').value.trim().toLowerCase();
                const senha = document.getElementById('senha').value;

                // 1. Logins Administrativos
                if (usuario === 'kennedy' && senha === '123') { window.location.href = 'admin.html'; }
                else if (usuario === 'pcp' && senha === '123') { window.location.href = 'pcp.html'; }
                else if (usuario === 'serra' && senha === '123') { window.location.href = 'serra.html'; }
                else if (usuario === 'almoxarifado' && senha === '123') { window.location.href = 'almoxarifado.html'; }
                
                // 2. Logins das Linhas de Produção
                else if (['stilo1', 'stilo2', 'stilo3', 'economica', 'hibrida', 'bux', 'desenvolvimento'].includes(usuario) && senha === '123') {
                    
                    // Salva na memória do tablet qual linha fez o login
                    localStorage.setItem('linha_logada', usuario);
                    
                    window.location.href = 'producao.html';
                }
                else {
                    alert('Usuário ou senha incorretos! Teste com o nome da sua linha (ex: stilo1, hibrida).');
                }
            });
        }
    </script>
</body>
</html>
