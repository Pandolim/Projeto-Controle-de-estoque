<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produção - Pedidos Extras</title>
    <link rel="stylesheet" href="style.css">
    <!-- Bibliotecas para o campo de busca (Select2) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
</head>
<body class="dashboard-body">
    
    <header class="dashboard-header">
        <h1>Solicitação de Peças Extras</h1>
        <div>
            <a href="login.html" class="btn-sair">Sair</a>
        </div>
    </header>

    <main class="dashboard-container">
        <section class="card" style="max-width: 600px; margin: 0 auto;">
            <h2>Nova Solicitação para o Estoque</h2>
            <p style="color: #7f8c8d; margin-bottom: 20px;">Use este formulário apenas para repor perdas ou faltas de linha.</p>
            
            <form id="formPedidoExtra">
    <!-- Novo campo: Linha Solicitante -->
    <div class="input-group" style="margin-bottom: 15px;">
        <label for="extraLinha" style="font-weight: bold; color: #34495e;">Linha Solicitante</label>
        <select id="extraLinha" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
            <option value="">Selecione a sua linha...</option>
            <option value="Stilo 1.0">Stilo 1.0</option>
            <option value="Stilo 2.0">Stilo 2.0</option>
            <option value="Stilo 3.0">Stilo 3.0</option>
            <option value="Economica">Economica</option>
            <option value="Hibrida">Hibrida</option>
            <option value="BUX">BUX</option>
            <option value="Desenvolvimento">Desenvolvimento</option>
        </select>
    </div>

    <!-- Campo Peça atualizado para lista Select2 -->
    <div class="input-group" style="margin-bottom: 15px;">
        <label for="extraPeca" style="font-weight: bold; color: #34495e;">Peça Necessária (Dimensões/Nome)</label>
        <select id="extraPeca" required style="width: 100%;">
            <option value="">Carregando catálogo de peças...</option>
        </select>
    </div>

    <div class="input-group" style="margin-bottom: 15px;">
        <label for="extraQtd" style="font-weight: bold; color: #34495e;">Quantidade Adicional</label>
        <input type="number" id="extraQtd" required min="1" placeholder="Ex: 5" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div class="input-group" style="margin-bottom: 15px;">
        <label for="extraMotivo" style="font-weight: bold; color: #34495e;">Justificativa (Obrigatório)</label>
        <textarea id="extraMotivo" required placeholder="Explique o motivo do pedido extra. Ex: 3 peças quebraram durante a montagem." rows="3" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; resize: vertical;"></textarea>
    </div>

    <button type="submit" class="btn-primary" style="width: 100%; background-color: #e74c3c; padding: 12px; font-size: 16px;">Enviar Pedido Extra</button>
</form>
        </section>
    </main>

    <script src="main.js"></script>
</body>
</html>
